name: Lint

# Checks C/C++ formatting with clang-format and the repository's .clang-format.
#
# This runs on `pull_request`, not `pull_request_target`, so code from a fork
# never runs with a write token: GitHub gives fork pull requests a read-only
# GITHUB_TOKEN. For every pull request and push the job fails if any file
# needs reformatting, annotates the changed lines, and prints the diff to
# apply. For pull requests from branches in this repository it also posts the
# fixes as review suggestions.
#
# To fix locally: clang-format -i -style=file <files>

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used for review suggestions on same-repository pull requests;
      # fork pull requests always get a read-only token.
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ClangFormat
        run: sudo apt-get install -y clang-format

      - name: Run clang-format
        run: |
          clang-format --version
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' '*.m' '*.mm' \
            ':!:vendor/' | xargs -0 clang-format -i -style=file

      - name: Suggest fixes
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: reviewdog/action-suggester@v1
        with:
          tool_name: lint

      - name: Check formatting
        run: |
          if git diff --quiet; then
            echo "All files are clang-formatted."
            exit 0
          fi
          git diff -U0 --no-color | awk '
            /^--- a\// { file = substr($0, 7) }
            /^@@ / {
              split($2, range, ",")
              line = substr(range[1], 2)
              if (line == 0) line = 1
              printf "::error file=%s,line=%s::Not clang-formatted; run clang-format -i -style=file %s\n", file, line, file
            }'
          echo "These files need clang-format; apply this diff or run"
          echo "clang-format -i -style=file on them:"
          git diff --no-color
          exit 1
